name: Bug Report
description: Report a bug in opencode-tell-sessions
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the form below.
        All communication must be in English.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OpenCode version, plugin version, OS, Bun/Node version
      placeholder: |
        - opencode version: ...
        - opencode-tell-sessions version: ...
        - OS: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the bug
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including error messages or logs
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have reproduced the bug with the latest version
          required: false
