name: Feature Request
description: Propose a new feature or improvement for opencode-tell-sessions
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Please fill in the form below.
        All communication must be in English.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?
      placeholder: "None"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues for duplicates
          required: true
