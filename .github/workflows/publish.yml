name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.1). Leave empty when triggered by a tag push."
        required: false
        default: ""
      dry-run:
        description: "Simulate the publish without uploading to npm."
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve target ref
        id: ref
        run: echo "ref=${{ inputs.tag != '' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        env:
          TAG: ${{ steps.ref.outputs.ref }}
        run: |
          VER="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public ${{ inputs.dry-run == true && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
