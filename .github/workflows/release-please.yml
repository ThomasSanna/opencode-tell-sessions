name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Use a PAT (RELEASE_PLEASE_TOKEN) if you want the tag push to
          # re-trigger the publish workflow. With the default GITHUB_TOKEN,
          # the tag is created but `on: push: tags` workflows do NOT fire
          # (documented GitHub limitation). Manual fallback: run the
          # "Publish to npm" workflow via workflow_dispatch with the tag.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
