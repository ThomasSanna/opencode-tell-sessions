version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # zod is pinned EXACTLY (4.1.8, no caret): a dual-copy mismatch with
      # @opencode-ai/plugin breaks the plugin at runtime. Never bump.
      - dependency-name: "zod"
      # typescript 7.x fails the strict typecheck; keep on 5.x for now.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
